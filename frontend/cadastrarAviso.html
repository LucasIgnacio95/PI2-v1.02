
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar - Cadastrar Aviso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="d-flex" id="wrapper">
        <div class="bg-white border-end card-estilizado-lateral" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fw-bold text-primary border-bottom">
                MENU
            </div>
            <div class="list-group list-group-flush d-flex flex-column h-100">
                <a href="/dashboard" class="list-group-item">Dashboard</a>
                <a href="/usuarios" class="list-group-item">Usuários</a>
                <a href="/alunos" class="list-group-item">Alunos</a>
                <a href="/chat" class="list-group-item">Mensagens/Chat</a>
                <!-- <a href="/eventos" class="list-group-item">Eventos</a> -->
                <a href="/avisos" class="list-group-item border-bottom active">Avisos</a>
                <a href="/logs" class="list-group-item border-bottom">Logs do Sistema</a>

                <a href="/" onclick="fazerLogout(event)" class="list-group-item text-danger fw-bold mt-auto mb-4">
                    Sair
                </a>
            </div>
            <!-- Botão de Acessibilidade na parte inferior da barra lateral -->
            <div class="p-3 text-center border-top mt-auto">
                <button onclick="alternarTamanhoFonte()" class="btn btn-outline-primary btn-sm w-100 fw-bold">
                    Acessibilidade (A+)
                </button>
            </div>
        </div>

        <div id="page-content-wrapper">

            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4 d-flex w-100">
                <div class="d-flex align-items-center">
                    <h2 class="fs-2 m-0">Novo Aviso</h2>
                </div>

                <div class="ms-auto d-flex align-items-center gap-2">
                    <span id="nomeUsuarioLogado" class="fw-bold text-secondary me-2 small"></span>
                    <a href="/chat" class="btn btn-outline-primary btn-sm fw-bold position-relative" title="Chat e Notificações">
                        💬 Chat
                        <span id="badgeNotifChat" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                            0
                        </span>
                    </a>                  
                </div>
            </nav>

            <div class="container-fluid px-4 d-flex flex-column align-items-center">

                <div class="card shadow-sm p-4 p-md-5 mb-4 card-estilizado w-100" style="max-width: 600px;">

                    <h4 class="mb-4 text-center text-primary fw-bold">Detalhes do Aviso</h4>

                    <div class="mb-3">
                        <label for="avisoTitulo" class="form-label fw-bold">Título do Aviso</label>
                        <input type="text" id="avisoTitulo" class="form-control" placeholder="Ex: Feriado Nacional, Trabalho de História...">
                    </div>

                    <div class="mb-3">
                        <label for="avisoTipo" class="form-label fw-bold">Categoria</label>
                        <select id="avisoTipo" class="form-select" style="width: 100%">
                            <option value="">Selecione uma categoria...</option>
                            <option value="Lição de Casa">Lição de Casa</option>
                            <option value="Trabalho">Trabalho ou Pesquisa</option>
                            <option value="Evento Escolar">Evento Escolar</option>
                            <option value="Reunião">Reunião de Pais/Mestres</option>
                            <option value="Feriado">Feriado/Recesso</option>
                            <option value="Aviso Geral">Aviso Geral</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <div class="mb-3">
                            <label for="avisoData" class="form-label fw-bold">Data do Evento/Entrega</label>
                            <input type="date" id="avisoData" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="avisoTurma" class="form-label fw-bold">Público / Turma</label>
                            <input type="text" id="avisoTurma" class="form-control" placeholder="Ex: 1º Ano B ou Geral">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="avisoDescricao" class="form-label fw-bold">Descrição Completa</label>
                        <textarea id="avisoDescricao" class="form-control" rows="4" placeholder="Descreva os detalhes importantes aqui..."></textarea>
                    </div>

                    <div class="d-flex justify-content-between mt-2">
                        <button onclick="window.location.href="/avisos"" class="btn btn-excluir btn-excluir:hover me-2" style="width: 48%;">
                            Cancelar
                        </button>
                        <button onclick="cadastrarAviso()" class="btn btn-primary fw-bold" style="width: 48%;">
                            Salvar Aviso
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
