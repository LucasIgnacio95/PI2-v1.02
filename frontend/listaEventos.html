<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar - Lista de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body">

    <div class="d-flex" id="wrapper">
        <div class="bg-white border-end card-estilizado-lateral" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fw-bold text-primary border-bottom">
                MENU
            </div>
            <div class="list-group list-group-flush d-flex flex-column h-100">
                <a href="/dashboard" class="list-group-item">Dashboard</a>
                <a href="/usuarios" class="list-group-item">Usuários</a>
                <a href="/alunos" class="list-group-item">Alunos</a>
                <a href="/chat" class="list-group-item">Mensagens/Chat</a>
                <a href="/eventos" class="list-group-item active">Eventos</a>
                <!-- <a href="/avisos" class="list-group-item border-bottom">Avisos</a> -->
                <a href="/" onclick="fazerLogout(event)" class="list-group-item text-danger fw-bold mt-auto mb-4">
                    Sair
                </a>
            </div>
        </div>



        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4">
                <div class="d-flex align-items-center">
                    <h2 class="fs-2 m-0">Lista de Eventos</h2>
                </div>
                <div class="ms-auto d-flex align-items-center gap-2">
                    <span id="nomeUsuarioLogado" class="fw-bold text-secondary me-2 small"></span>
                    <a href="/chat" class="btn btn-outline-primary btn-sm fw-bold position-relative" title="Chat e Notificações">
                        💬 Chat
                        <span id="badgeNotifChat" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                            0
                        </span>
                    </a>                  
                </div>
                    <button onclick="alternarTamanhoFonte()" class="btn btn-outline-primary btn-sm w-100 fw-bold">
                        Acessibilidade (A+)
                    </button>
                </div>
            </nav>

            <div class="container-fluid px-4 d-flex flex-column align-items-center">

                <div class="card shadow-sm p-4 mb-4 card-estilizado w-100" style="max-width: 900px;">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th scope="col" class="text-start">Descrição</th>
                                    <th scope="col" class="text-start">Data do Registro</th>
                                    <th scope="col" class="text-start">Aluno</th>
                                    <th scope="col" class="text-start">Evento</th>
                                </tr>
                            </thead>
                            <tbody id="listaRotina">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-3 w-100 text-center">
                    <button onclick="carregarEventosRotinas()" class="btn btn-primary btn-pt btn-acao btn-acao:active"
                            style="width: 30%; min-width: 200px;">
                        Atualizar Lista de Rotinas
                    </button>
                </div>
            </div>

            <div class="container-fluid px-4 d-flex flex-column align-items-center mt-5">

                <div class="card shadow-sm p-4 mb-4 card-estilizado w-100" style="max-width: 900px;">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th scope="col" class="text-start">Descrição</th>
                                    <th scope="col" class="text-start">Data do Registro</th>
                                    <th scope="col" class="text-start">Aluno</th>
                                    <th scope="col" class="text-start">Evento</th>
                                </tr>
                            </thead>
                            <tbody id="listaOcorrencia">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-3 w-100 text-center">
                    <button onclick="carregarEventosOcorrencias()"
                            class="btn btn-primary btn-pt btn-acao btn-acao:active"
                            style="width: 30%; min-width: 200px;">
                        Atualizar Lista de Ocorrências
                    </button>

                </div>
            </div>

            <div class="mt-3 w-100 text-center mt-5">
                <button onclick="window.location.href='/registrar-evento'"
                        class="btn btn-sm btn-acao btn-excluir me-2" style="width: 30%;">
                    Cadastrar
                    Eventos
                </button>
            </div>
        </div>


    </div>

    <script src="script.js"></script>
    </body>

</html>
