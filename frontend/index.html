<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - Prontuário Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 12px;
        }

        .input-estilizado {
            background-color: #eef2f6;
            border: none;
            border-radius: 8px;
            padding: 12px 15px;
        }

            .input-estilizado:focus {
                background-color: #e4ebf3;
                box-shadow: none;
                border: 1px solid #0d6efd;
            }

        .texto-pequeno {
            font-size: 0.85rem;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100 position-relative">

    <div class="card border-0 shadow-sm p-4 p-md-5 login-card">

        <div class="text-center mb-4">
            <div class="mb-2" style="font-size: 2.5rem;">🎓</div>
            <h4 class="fw-bold mb-1">Entrar no Sistema</h4>
            <p class="text-muted texto-pequeno mb-0 mt-2">Digite seu usuário abaixo para acessar sua conta</p>
            <p class="text-muted texto-pequeno">*Acesso para responsáveis e profissionais</p>
        </div>

        <div class="mb-3">
            <label for="usuario" class="form-label fw-bold texto-pequeno mb-1">Usuário</label>
            <input type="text" id="usuario" class="form-control input-estilizado texto-pequeno" placeholder="Nome de usuário">
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="senha" class="form-label fw-bold texto-pequeno mb-0">Senha</label>
            </div>
            <div class="input-group">
                <input type="password" id="senha" class="form-control input-estilizado texto-pequeno" placeholder="••••••••••••">
                <button class="btn btn-outline-secondary" type="button" id="btnToggleLoginSenha" onclick="toggleVisibilidadeLogin()">👁️</button>
            </div>
        </div>

        <button onclick="login()" class="btn btn-primary w-100 fw-bold py-2" style="border-radius: 8px;">
            Entrar
        </button>

        <div class="text-center mt-4 texto-pequeno fw-bold">
            <span class="text-muted">Não tem uma conta?</span>
            <a href="#" class="text-decoration-none text-primary">Solicite na secretaria</a>
        </div>

    </div>

    <footer class="position-absolute bottom-0 text-center w-100 pb-3 text-muted" style="font-size: 0.75rem;">
        <div>🔒 Ambiente seguro com criptografia e consentimento prévio dos responsáveis legais.</div>
        <div class="mt-1">Versão v1.0.2 &bull; Proteção de dados e conformidade aplicadas.</div>
    </footer>

    <script src="script.js"></script>
</body>
